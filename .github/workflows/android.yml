name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      run: |
        if [ -n "${{ secrets.KEYSTORE }}" ]; then
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
          echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
          echo KEYSTORE_FILE=../key.jks >> signing.properties
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > key.jks
        fi

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Build Release
      run: ./gradlew assembleRelease || ./gradlew assembleDebug

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@v4
      with:
        name: speedrevanced-ci-debug-apk
        path: app/build/outputs/apk/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: speedrevanced-ci-release-apk
        path: |
          app/build/outputs/apk/release
          app/build/outputs/apk/debug

    - name: Create AutoBuild Release
      run: |
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -n "$APK_FILE" ]; then
          cp "$APK_FILE" "SpeedRevanced-${GIT_DESCRIBE}.apk"
          gh release delete autobuild --yes || true
          gh release create autobuild "SpeedRevanced-${GIT_DESCRIBE}.apk" \
            --prerelease \
            --title "Speed Revanced Build ${GIT_DESCRIBE}" \
            --notes "Automated build from commit ${GIT_DESCRIBE}."
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}